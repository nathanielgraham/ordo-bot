# Example configuration for ordo-bot
# Copy this file to config.toml and edit the values.

# ------------------------------------------------------------------
# Ordo connection
# ------------------------------------------------------------------
ordo_ws_url = "wss://ordoscheduler.com/websocket"
ordo_token = "YOUR_ORDO_API_TOKEN_HERE"

# ------------------------------------------------------------------
# LLM (OpenAI-compatible endpoint)
# ------------------------------------------------------------------
llm_base_url = "http://localhost:11434/v1"
llm_api_key = "ollama"
llm_model = "llama3.2"

# Groq example:
# llm_base_url = "https://api.groq.com/openai/v1"
# llm_api_key = "gsk_..."
# llm_model = "qwen/qwen3.6-27b"

# ------------------------------------------------------------------
# Agent context hygiene / bootstrap
# ------------------------------------------------------------------
# Max non-system messages kept in history. 0 = unlimited (large models).
max_history_messages = 24
# Max characters of each tool result stored for the LLM.
tool_result_max_chars = 2500

# Startup guidance:
#   minimal  — short system prompt only (tight TPM / tiny models)
#   standard — fixed prompts/bootstrap.md + optional live docs (default)
#   rich     — standard + optional project markdown (opt-in)
bootstrap_mode = "standard"
# Live get_documentation summary after login (ignored when mode=minimal)
bootstrap_docs = true
# Override playbook path (empty = prompts/bootstrap.md)
# bootstrap_playbook_path = "prompts/bootstrap.md"
# Project-specific notes (only read when bootstrap_mode = "rich")
# bootstrap_extra_md = "prompts/project.md"

# ------------------------------------------------------------------
# Frontend WebSocket server
# ------------------------------------------------------------------
frontend_host = "127.0.0.1"
frontend_port = 8765

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
log_level = "INFO"
